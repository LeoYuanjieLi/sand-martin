[project]
name = "sand-martin"
version = "0.3.0"
description = "An MCP server for generating and managing Grasshopper Python components"
readme = "README.md"
authors = [
    { name = "Leo Li", email = "pbleoli@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = ["mcp", "rhino", "grasshopper", "llm", "automation", "architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "rhino3dm>=8.4.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/LeoYuanjieLi/sand-martin"
Issues = "https://github.com/LeoYuanjieLi/sand-martin/issues"
Repository = "https://github.com/LeoYuanjieLi/sand-martin"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sand_martin = "sand_martin.server:main"
